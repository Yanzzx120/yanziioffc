
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Contact - Portfolio Website</title>
<link rel="stylesheet" href="css/neo.css">
<link rel="stylesheet" href="css/neo-site.css">
<link rel="stylesheet" href="css/nebula.css">
<link rel="stylesheet" href="css/fx.css">
</head>

<body>
<script src="js/config.js"></script>
<script src="js/fx.js"></script>
<script src="js/guard.js"></script>
    <div id="siteNav"></div>
<div class="contact-container">
        <div class="contact-content">
            <div class="contact-info">
                <div class="contact-header">
                    <h1>Get in Touch</h1>
                    <p>Feel free to reach out to me for any questions or opportunities.</p>
                </div>

                <div class="contact-details">
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-whatsapp"></i>
                        </div>
                        <div class="contact-text">
                            <h3>Whatsapp</h3>
                            <p>6285842176747</p>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="contact-text">
                            <h3>Email</h3>
                            <p>yanziioffc@gmail.com</p>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-location-dot"></i>
                        </div>
                        <div class="contact-text">
                            <h3>Location</h3>
                            <p>Majalengka, Indonesia</p>
                        </div>
                    </div>
                </div>

                <div class="social-links">
                    <a href="https://wa.me/6285842176747"><i class="fab fa-whatsapp"></i></a>
                    <a href="https://t.me/yanziioffc"><i class="fab fa-telegram"></i></a>
                    <a href="https://www.instagram.com/yanziioffc?evlk=MXNtaThidHl4bnc4dQ=="><i class="fab fa-instagram"></i></a>
                </div>
            </div>

            <div class="contact-form">
                <form id="cForm">
                    <div class="form-group">
                        <input type="text" id="name" name="name" required>
                        <label for="name">Your Name</label>
                    </div>

                    <div class="form-group">
                        <input type="email" id="email" name="email" required>
                        <label for="email">Your Email</label>
                    </div>

                    <div class="form-group">
                        <input type="text" id="subject" name="subject" required>
                        <label for="subject">Subject</label>
                    </div>

                    <div class="form-group">
                        <textarea id="message" name="message" required></textarea>
                        <label for="message">Your Message</label>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/nav.js"></script>
<script>
document.getElementById('cForm').addEventListener('submit',function(e){
  e.preventDefault(); const g=id=>document.getElementById(id).value.trim();
  const t='Halo, saya '+g('name')+' ('+g('email')+')\nSubjek: '+g('subject')+'\n\n'+g('message');
  window.open('https://wa.me/'+SHOP.wa+'?text='+encodeURIComponent(t),'_blank'); this.reset();
});
</script>
<script src="js/sound.js"></script>
<script src="js/bg3d.js"></script>
<script src="js/clock.js"></script>
</body>

</html>
