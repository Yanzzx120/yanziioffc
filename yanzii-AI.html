<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>yanzii-AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Load highlight.js untuk syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #343541;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-wrapper {
      width: 100%; max-width: 720px; height: 95vh;
      display: flex; flex-direction: column;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      background-color: #444654;
    }
    .chat-header {
      background-color: #202123; padding: 15px;
      font-size: 1.3rem; text-align: center; font-weight: bold;
    }
    .chat-container {
      flex: 1; overflow-y: auto; padding: 15px;
      display: flex; flex-direction: column; gap: 15px;
      scroll-behavior: smooth;
    }
    .chat-message {
      padding: 12px; border-radius: 8px; max-width: 85%;
      white-space: pre-wrap; word-wrap: break-word; position: relative;
    }
    .user-message { align-self: flex-end; background-color: #2f80ed; color: white; }
    .ai-message { align-self: flex-start; background-color: #3c3f4a; }
    .message-header {
      font-size: 0.85rem; font-weight: bold;
      margin-bottom: 5px; opacity: 0.7;
    }
    .message-content pre {
      background: #1e1e1e; padding: 30px 10px 10px;
      border-radius: 6px; overflow-x: auto; margin: 8px 0;
    }
    .message-content code { font-family: Consolas, monospace; font-size: 0.9em; }
    .chat-input-area {
      display: flex; align-items: center;
      padding: 10px; background-color: #202123; gap: 6px;
    }
    .chat-input-area textarea {
      flex: 1; resize: none; padding: 8px;
      border-radius: 5px; border: none; font-size: 1rem;
      background: #343541; color: white; height: 40px;
    }
    .chat-input-area button {
      background: #10a37f; color: white; border: none;
      padding: 8px 12px; border-radius: 5px; cursor: pointer;
    }
    .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .upload-btn { background: #555; }
    .typing-indicator { display: flex; gap: 5px; padding: 10px; align-self: flex-start; }
    .typing-indicator span {
      width: 8px; height: 8px; background: #999;
      border-radius: 50%; animation: bounce 1s infinite alternate;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      from { transform: translateY(0); } to { transform: translateY(-6px); }
    }
    .modal {
      display: none; position: fixed; z-index: 999;
      inset: 0; background: rgba(0,0,0,0.7);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; color: #000; padding: 20px;
      border-radius: 8px; max-width: 400px; width: 90%;
    }
    .modal-content input {
      width: 100%; padding: 8px; margin: 10px 0;
      box-sizing: border-box;
    }
    .close-modal { float: right; font-size: 20px; cursor: pointer; }
    .upload-progress { background: #111; padding: 5px; text-align: center; }
    .progress-bar { height: 5px; background: #10a37f; width: 0%; transition: width 0.2s; }
    .progress-text { font-size: 12px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header class="chat-header">yanzii-AI</header>
    <div id="chat-container" class="chat-container">
      <div id="typing-indicator" class="typing-indicator" style="display: none;">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="chat-input-area">
      <button id="upload-btn" class="upload-btn" title="Upload file">📎</button>
      <input type="file" id="file-upload" accept="image/*,text/*,.pdf,.json,.md" hidden>
      <textarea id="message-input" placeholder="Tulis pesan... (Shift+Enter untuk baris baru)"></textarea>
      <button id="send-button" disabled>Kirim</button>
    </div>
    <div id="upload-progress" class="upload-progress" style="display:none">
      <div id="progress-bar" class="progress-bar"></div>
      <div id="progress-text" class="progress-text">0%</div>
    </div>
  </div>

  <div id="file-description-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <h3>Deskripsi File</h3>
      <input id="file-description" type="text" placeholder="Tambahkan deskripsi...">
      <button id="send-file-button">Kirim File</button>
    </div>
  </div>

  <script>
    // ============================================================
    // ⚠️ GANTI DENGAN API KEY BARU DARI https://aistudio.google.com/apikey
    // ============================================================
    const API_KEY = "AQ.Ab8RN6KIUAMUC8c_5ouB_d7yuW_uOmCeZGxrLVxxycXE3bVsbA";
    const MODEL = "gemini-3.1-flash-lite";
    const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

    // ============================================================
    // DOM References
    // ============================================================
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const chatContainer = document.getElementById('chat-container');
    const typingIndicator = document.getElementById('typing-indicator');
    const fileUpload = document.getElementById('file-upload');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadProgress = document.getElementById('upload-progress');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const fileDescriptionModal = document.getElementById('file-description-modal');
    const fileDescriptionInput = document.getElementById('file-description');
    const sendFileButton = document.getElementById('send-file-button');

    // ============================================================
    // State
    // ============================================================
    let uploadedFile = null;         // { dataUrl, mimeType, name }
    let chatHistory = [];            // riwayat percakapan untuk konteks
    let isSending = false;

    // System instruction agar AI konsisten
    const SYSTEM_PROMPT = "Anda adalah yanzii-AI, asisten AI yang ramah, membantu, dan menjawab dalam bahasa yang sama dengan pengguna. Gunakan format markdown jika perlu, terutama untuk kode.";

    // ============================================================
    // Input handlers
    // ============================================================
    messageInput.addEventListener('input', () => {
      sendButton.disabled = messageInput.value.trim() === '' || isSending;
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
    });

    // Enter = kirim, Shift+Enter = baris baru
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendButton.disabled) sendMessage();
      }
    });

    sendButton.addEventListener('click', sendMessage);
    uploadBtn.addEventListener('click', () => fileUpload.click());
    fileUpload.addEventListener('change', handleFileUpload);

    document.querySelector('.close-modal').addEventListener('click', closeModal);
    sendFileButton.addEventListener('click', sendFileWithDescription);

    function closeModal() {
      fileDescriptionModal.style.display = 'none';
      fileDescriptionInput.value = '';
      uploadedFile = null;
      fileUpload.value = '';
    }

    // ============================================================
    // Send message (teks)
    // ============================================================
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isSending) return;

      addMessage('Anda', text, 'user-message');
      chatHistory.push({ role: 'user', parts: [{ text }] });

      messageInput.value = '';
      messageInput.style.height = '50px';
      sendButton.disabled = true;

      await callAIAndRender();
    }

    // ============================================================
    // Upload file
    // ============================================================
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Batas 10MB (limit Gemini inline data)
      if (file.size > 10 * 1024 * 1024) {
        alert('Ukuran file maksimal 10MB.');
        fileUpload.value = '';
        return;
      }

      uploadProgress.style.display = 'block';
      progressBar.style.width = '0%';
      progressText.textContent = '0%';

      const reader = new FileReader();
      reader.onprogress = (e) => {
        if (e.lengthComputable) {
          const p = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = p + '%';
          progressText.textContent = p + '%';
        }
      };
      reader.onload = () => {
        uploadedFile = {
          dataUrl: reader.result,
          mimeType: file.type || 'application/octet-stream',
          name: file.name,
          isImage: file.type.startsWith('image/')
        };
        uploadProgress.style.display = 'none';
        fileDescriptionModal.style.display = 'flex';
      };
      reader.onerror = () => {
        uploadProgress.style.display = 'none';
        alert('Gagal membaca file.');
      };
      reader.readAsDataURL(file);
    }

    async function sendFileWithDescription() {
      const description = fileDescriptionInput.value.trim() || uploadedFile?.name || 'File';
      if (!uploadedFile) return;

      // Tampilkan di chat
      if (uploadedFile.isImage) {
        addImageMessage('Anda', uploadedFile.dataUrl, uploadedFile.name, description);
      } else {
        addMessage('Anda', `📎 ${uploadedFile.name}\n${description}`, 'user-message');
      }

      // Siapkan parts untuk Gemini
      const parts = [];
      if (uploadedFile.isImage) {
        const base64 = uploadedFile.dataUrl.split(',')[1];
        parts.push({ inline_data: { mime_type: uploadedFile.mimeType, data: base64 } });
      }
      parts.push({ text: description + (uploadedFile.isImage ? '' : `\n\n(Nama file: ${uploadedFile.name})`) });
      chatHistory.push({ role: 'user', parts });

      // Reset modal
      fileDescriptionModal.style.display = 'none';
      fileDescriptionInput.value = '';
      uploadedFile = null;
      fileUpload.value = '';

      await callAIAndRender();
    }

    // ============================================================
    // Core: panggil API Gemini
    // ============================================================
    async function callAIAndRender() {
      isSending = true;
      sendButton.disabled = true;
      typingIndicator.style.display = 'flex';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await getGeminiResponse();
        typingIndicator.style.display = 'none';
        addMessage('yanzii-AI', response, 'ai-message');
        chatHistory.push({ role: 'model', parts: [{ text: response }] });
      } catch (err) {
        typingIndicator.style.display = 'none';
        addMessage('yanzii-AI', `⚠️ Error: ${err.message}`, 'ai-message');
      } finally {
        isSending = false;
        sendButton.disabled = messageInput.value.trim() === '';
      }
    }

    async function getGeminiResponse() {
      // Batasi riwayat agar tidak terlalu panjang
      const trimmedHistory = chatHistory.slice(-20);

      const body = {
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: trimmedHistory,
        generationConfig: {
          maxOutputTokens: 2048
        }
      };

      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        const msg = errData?.error?.message || `HTTP ${res.status}`;
        if (res.status === 403 || msg.toLowerCase().includes('leaked')) {
          throw new Error('API Key tidak valid atau sudah diblokir. Buat key baru di https://aistudio.google.com/apikey');
        }
        if (res.status === 429) {
          throw new Error('Terlalu banyak permintaan (rate limit). Coba lagi nanti.');
        }
        throw new Error(msg);
      }

      const data = await res.json();
      const candidates = data?.candidates;
      if (!candidates || candidates.length === 0) {
        // Cek jika diblokir safety
        if (data?.promptFeedback?.blockReason) {
          throw new Error(`Diblokir oleh filter keamanan: ${data.promptFeedback.blockReason}`);
        }
        throw new Error('Tidak ada respons dari AI.');
      }

      const parts = candidates[0]?.content?.parts || [];
      const text = parts.map(p => p.text || '').join('').trim();
      if (!text) throw new Error('Respons kosong dari AI.');
      return text;
    }

    // ============================================================
    // Rendering
    // ============================================================
    function addMessage(sender, text, messageClass) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `chat-message ${messageClass}`;

      const headerDiv = document.createElement('div');
      headerDiv.className = 'message-header';
      headerDiv.textContent = sender;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = formatMessage(text);

      // Tambahkan tombol salin untuk setiap code block
      contentDiv.querySelectorAll('pre code').forEach((codeBlock) => {
        const copyBtn = document.createElement('button');
        copyBtn.textContent = 'Salin';
        copyBtn.className = 'copy-button';
        Object.assign(copyBtn.style, {
          position: 'absolute', top: '8px', right: '8px',
          background: '#4CAF50', color: 'white', border: 'none',
          borderRadius: '4px', padding: '3px 8px', cursor: 'pointer', fontSize: '12px'
        });
        copyBtn.onclick = () => copyCode(codeBlock);
        const pre = codeBlock.parentElement;
        pre.style.position = 'relative';
        pre.appendChild(copyBtn);
      });

      messageDiv.appendChild(headerDiv);
      messageDiv.appendChild(contentDiv);
      chatContainer.insertBefore(messageDiv, typingIndicator);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Highlight syntax
      if (window.hljs) {
        contentDiv.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      }
    }

    function addImageMessage(sender, imageSrc, fileName, description) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message user-message';

      const headerDiv = document.createElement('div');
      headerDiv.className = 'message-header';
      headerDiv.textContent = sender;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      const img = document.createElement('img');
      img.src = imageSrc;
      img.alt = fileName;
      Object.assign(img.style, { maxWidth: '100%', borderRadius: '12px', marginBottom: '10px' });

      const p = document.createElement('p');
      p.textContent = description;

      contentDiv.appendChild(img);
      contentDiv.appendChild(p);
      messageDiv.appendChild(headerDiv);
      messageDiv.appendChild(contentDiv);

      chatContainer.insertBefore(messageDiv, typingIndicator);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Format markdown sederhana + escape HTML agar aman
    function formatMessage(text) {
      // Escape HTML dulu (kecuali code block)
      const codeBlocks = [];
      text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        const escaped = code
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        codeBlocks.push(`<pre><code class="language-${lang || 'plaintext'}">${escaped}</code></pre>`);
        return `\u0000CODE${idx}\u0000`;
      });

      // Escape sisa teks
      text = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Bold, italic, inline code
      text = text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`\n]+)`/g, '<code>$1</code>');

      // Baris baru → <br>
      text = text.replace(/\n/g, '<br>');

      // Kembalikan code block
      text = text.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => codeBlocks[+i]);

      return text;
    }

    function copyCode(codeBlock) {
      navigator.clipboard.writeText(codeBlock.innerText)
        .then(() => alert('Kode berhasil disalin!'))
        .catch(() => alert('Gagal menyalin kode.'));
    }

    // Expose closeModal untuk onclick di HTML
    window.closeModal = closeModal;
  </script>
</body>
</html>
