

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Skills - Portfolio Website</title>
<link rel="stylesheet" href="css/neo.css">
<link rel="stylesheet" href="css/neo-site.css">
<link rel="stylesheet" href="css/nebula.css">
<link rel="stylesheet" href="css/fx.css">
</head>
<body>
<script src="js/config.js"></script>
<script src="js/fx.js"></script>
<script src="js/guard.js"></script>
    <div id="siteNav"></div>
<div class="skills-container">
        <div class="skills-content">
            <div class="skills-header">
                <h1>My Skills</h1>
            </div>
            <div class="skills-grid">
                
                <div class="skill-category">
                    <div class="skill-icon">
                        <i class="fa fa-car"></i>
                    </div>
                    <h2>Frontend Development</h2>
                    <div class="skill-list">
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>HTML</h3>
                                <span>25%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 10%"></div>
                            </div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>CSS</h3>
                                <span>50%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 50%"></div>
                            </div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>JavaScript</h3>
                                <span>85%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 85%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="skill-category">
                    <div class="skill-icon">
                        <i class="fas fa-database"></i>
                    </div>
                    <h2>Backend Development</h2>
                    <div class="skill-list">
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>PHP</h3>
                                <span>88%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 88%"></div>
                            </div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>Node.js</h3>
                                <span>82%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 82%"></div>
                            </div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>Python</h3>
                                <span>75%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="skill-category">
                    <div class="skill-icon">
                        <i class="fas fa-paint-brush"></i>
                    </div>
                    <h2>Design Tools</h2>
                    <div class="skill-list">
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>Photoshop</h3>
                                <span>92%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 92%"></div>
                            </div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>Figma</h3>
                                <span>85%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 85%"></div>
                            </div>
                        </div>
                        <div class="skill-item">
                            <div class="skill-info">
                                <h3>Adobe XD</h3>
                                <span>78%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 78%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        
        
        function hamburg() {
            const navbar = document.querySelector(".dropdown")
            navbar.style.transform = "translateY(0px)"
        }
        
        function cancel() {
            const navbar = document.querySelector(".dropdown")
            navbar.style.transform = "translateY(-500px)"
        }
    </script>
<script src="js/nav.js"></script>
<script src="js/sound.js"></script>
<script src="js/bg3d.js"></script>
<script src="js/clock.js"></script>
</body>
</html>
