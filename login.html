<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yannLytr — Login</title>

  <!-- ✅ FIX: Tambah Remixicon (ikon mata, email, dll) -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap");

    :root {
      --first-color: hsl(208, 92%, 54%);
      --first-color-alt: hsl(208, 88%, 50%);
      --title-color: hsl(220, 68%, 4%);
      --white-color: hsl(0, 0%, 100%);
      --text-color: hsl(220, 15%, 66%);
      --body-color: hsl(0, 0%, 100%);
      --container-color: hsl(220, 50%, 97%);
      --body-font: "Montserrat", system-ui;
      --big-font-size: 1.5rem;
      --normal-font-size: .938rem;
      --small-font-size: .813rem;
      --tiny-font-size: .688rem;
      --font-regular: 400;
      --font-medium: 500;
      --font-semi-bold: 600;
    }

    @media screen and (min-width: 1150px) {
      :root {
        --big-font-size: 3rem;
        --normal-font-size: 1rem;
        --small-font-size: .875rem;
        --tiny-font-size: .75rem;
      }
    }

    * { box-sizing: border-box; padding: 0; margin: 0; }

    body, input, button {
      font-family: var(--body-font);
      font-size: var(--normal-font-size);
    }

    body {
      background-color: var(--body-color);
      color: var(--text-color);
    }

    input, button { border: none; outline: none; }
    a { text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }

    .container { max-width: 1120px; margin-inline: 1.5rem; }
    .grid { display: grid; gap: 1rem; }

    .login {
      position: relative;
      height: 100vh;
      align-items: center;
      overflow: hidden;
    }

    .login__blob { display: none; }

    .login__title {
      font-size: var(--big-font-size);
      color: var(--title-color);
      text-align: center;
      margin-bottom: 2rem;
    }

    .login__box {
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--container-color);
      border-radius: 1rem;
    }

    .login__input {
      background: none;
      width: 100%;
      padding: 1.5rem 2.5rem 1.5rem 1.25rem;
      font-weight: var(--font-semi-bold);
      border: 3px solid transparent;
      border-radius: 1rem;
      z-index: 1;
      transition: border-color .4s;
    }

    .login__input:autofill { transition: background-color 6000s, color 6000s; }

    .login__label {
      position: absolute;
      left: 1.25rem;
      font-weight: var(--font-semi-bold);
      transition: transform .4s, font-size .4s, color .4s;
      pointer-events: none;
    }

    .login__icon {
      position: absolute;
      right: 1rem;
      font-size: 1.25rem;
      transition: color .4s;
    }

    .login__password { cursor: pointer; z-index: 10; }

    .login__forgot {
      display: block;
      width: max-content;
      margin: 1rem 0 0 auto;
      font-size: var(--small-font-size);
      font-weight: var(--font-semi-bold);
      color: var(--text-color);
      transition: color .4s;
    }

    .login__forgot:hover { color: var(--first-color); }

    .login__button {
      width: 100%;
      display: inline-flex;
      justify-content: center;
      background-color: var(--first-color);
      color: var(--white-color);
      font-weight: var(--font-semi-bold);
      padding-block: 1.5rem;
      border-radius: 4rem;
      margin-block: 2rem;
      cursor: pointer;
      transition: background-color .4s, box-shadow .4s;
    }

    .login__button:hover {
      background-color: var(--first-color-alt);
      box-shadow: 0 8px 24px hsla(208, 92%, 32%, .3);
    }

    .login__switch {
      text-align: center;
      font-size: var(--small-font-size);
    }

    .login__switch button {
      background: none;
      color: var(--first-color);
      font-size: var(--small-font-size);
      font-weight: var(--font-semi-bold);
      cursor: pointer;
      transition: color .4s;
    }

    .login__switch button:hover { color: var(--first-color-alt); }

    .login__access,
    .login__register {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      transition: transform .4s, opacity .4s .1s;
    }

    .login__register {
      transform: translateX(15rem);
      opacity: 0;
      pointer-events: none;
    }

    /* FIX: label naik saat input fokus / terisi */
    .login__input:focus ~ .login__label,
    .login__input:not(:placeholder-shown) ~ .login__label {
      transform: translateY(-12px);
      font-size: var(--tiny-font-size);
    }

    .login__input:focus,
    .login__input:not(:placeholder-shown) {
      padding-block: 2rem 1rem;
    }

    .login__input:focus { border-color: var(--first-color); }

    .login__input:focus ~ .login__label,
    .login__input:focus ~ .login__icon {
      color: var(--first-color);
    }

    /* Toggle login/register */
    .active .login__access {
      transform: translateX(15rem);
      opacity: 0;
      pointer-events: none;
    }

    .active .login__register {
      transform: translateX(0);
      opacity: 1;
      pointer-events: initial;
    }

    @media screen and (max-width: 320px) { .container { margin-inline: 1rem; } }

    @media screen and (min-width: 540px) {
      .login__area { width: 380px; margin-inline: auto; }
    }

    @media screen and (min-width: 350px) and (max-height: 600px) {
      .login { height: 760px; }
    }

    @media screen and (min-width: 1150px) {
      .container { margin-inline: auto; }
      .login__area { width: 460px; margin: initial; }
      .login__access, .login__register { width: 600px; }
      .login__title { text-align: initial; margin-bottom: 3rem; }
      .login__button { margin-bottom: 3rem; }
      .login__group { grid-template-columns: repeat(2, 1fr); }
      .login__blob {
        display: block;
        height: 100vh;
        position: absolute;
        top: 0;
        right: 0;
      }
    }
  </style>
</head>
<body>

  <div class="login container grid" id="loginAccessRegister">

    <!-- ===== LOGIN ACCESS ===== -->
    <div class="login__access">
      <h1 class="login__title">Log in to your account.</h1>

      <div class="login__area">
        <!-- ✅ FIX: pakai form id & onsubmit -->
        <form class="login__form" id="loginForm" onsubmit="handleLogin(event)">
          <div class="login__content grid">
            <div class="login__box">
              <input type="email" id="loginEmail" required placeholder=" " class="login__input">
              <label for="loginEmail" class="login__label">Email</label>
              <i class="ri-mail-fill login__icon"></i>
            </div>

            <div class="login__box">
              <!-- ✅ FIX: id input = loginPassInput, id icon = loginPassEye -->
              <input type="password" id="loginPassInput" required placeholder=" " class="login__input">
              <label for="loginPassInput" class="login__label">Password</label>
              <i class="ri-eye-off-fill login__icon login__password" id="loginPassEye"></i>
            </div>
          </div>

          <a href="#" class="login__forgot">Forgot your password?</a>

          <button type="submit" class="login__button">Login</button>
        </form>

        <p class="login__switch">
          Don't have an account?
          <button type="button" id="loginButtonRegister">Create Account</button>
        </p>
      </div>
    </div>

    <!-- ===== LOGIN REGISTER ===== -->
    <div class="login__register">
      <h1 class="login__title">Create new account.</h1>

      <div class="login__area">
        <!-- ✅ FIX: form id & onsubmit -->
        <form class="login__form" id="registerForm" onsubmit="handleRegister(event)">
          <div class="login__content grid">
            <div class="login__group grid">
              <div class="login__box">
                <input type="text" id="regNama" required placeholder=" " class="login__input">
                <label for="regNama" class="login__label">Nama Lengkap</label>
                <i class="ri-id-card-fill login__icon"></i>
              </div>

              <div class="login__box">
                <input type="text" id="regUsername" required placeholder=" " class="login__input">
                <label for="regUsername" class="login__label">Username</label>
                <i class="ri-id-card-fill login__icon"></i>
              </div>
            </div>

            <div class="login__box">
              <input type="email" id="regEmail" required placeholder=" " class="login__input">
              <label for="regEmail" class="login__label">Email</label>
              <i class="ri-mail-fill login__icon"></i>
            </div>

            <div class="login__box">
              <!-- ✅ FIX: id input = regPassInput, id icon = regPassEye -->
              <input type="password" id="regPassInput" required placeholder=" " class="login__input">
              <label for="regPassInput" class="login__label">Password</label>
              <i class="ri-eye-off-fill login__icon login__password" id="regPassEye"></i>
            </div>
          </div>

          <button type="submit" class="login__button">Create account</button>
        </form>

        <p class="login__switch">
          Already have an account?
          <button type="button" id="loginButtonAccess">Log In</button>
        </p>
      </div>
    </div>
  </div>

  <script>
    /* =============================================
       1. TOGGLE SHOW/HIDE PASSWORD (generic)
       ============================================= */
    function setupPasswordToggle(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (!input || !eye) return;

      eye.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        eye.classList.toggle('ri-eye-fill');
        eye.classList.toggle('ri-eye-off-fill');
      });
    }

    setupPasswordToggle('loginPassInput', 'loginPassEye');
    setupPasswordToggle('regPassInput', 'regPassEye');

    /* =============================================
       2. TOGGLE LOGIN <-> REGISTER
       ============================================= */
    const container = document.getElementById('loginAccessRegister');
    const buttonRegister = document.getElementById('loginButtonRegister');
    const buttonAccess = document.getElementById('loginButtonAccess');

    buttonRegister.addEventListener('click', () => container.classList.add('active'));
    buttonAccess.addEventListener('click', () => container.classList.remove('active'));

    /* =============================================
       3. REGISTER — simpan ke localStorage
       ============================================= */
    function handleRegister(e) {
      e.preventDefault();

      const nama = document.getElementById('regNama').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassInput').value;

      if (!nama || !username || !email || !password) {
        alert('Semua data harus diisi!');
        return;
      }
      if (password.length < 6) {
        alert('Password minimal 6 karakter!');
        return;
      }
      if (localStorage.getItem('user_' + email)) {
        alert('Email sudah terdaftar! Silakan login.');
        return;
      }

      const userData = { nama, username, email, password };
      localStorage.setItem('user_' + email, JSON.stringify(userData));

      alert('Registrasi berhasil! Silakan login.');
      document.getElementById('registerForm').reset();
      container.classList.remove('active'); // balik ke login
    }

    /* =============================================
       4. LOGIN — validasi & redirect
       ============================================= */
    function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassInput').value;

      if (!email || !password) {
        alert('Email dan password harus diisi!');
        return;
      }

      const data = localStorage.getItem('user_' + email);
      if (!data) {
        alert('Email tidak ditemukan! Silakan daftar dulu.');
        return;
      }

      const user = JSON.parse(data);
      if (user.password !== password) {
        alert('Password salah!');
        return;
      }

      // ✅ Simpan sesi login
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('loggedUser', JSON.stringify({ nama: user.nama, email: user.email }));

      alert('Login berhasil!');
      window.location.href = 'index.html'; // ganti sesuai halaman utama
    }

    /* =============================================
       5. AUTO-REDIRECT jika sudah login
       ============================================= */
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
